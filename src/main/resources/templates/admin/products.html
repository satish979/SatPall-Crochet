<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="header :: head('Admin Products')"></head>

<body>
    <div th:replace="header :: navbar"></div>

    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="mb-1">Product Management</h1>
                    <p class="text-muted mb-0">Create, edit, delete, and manage product images.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/products/new}">Add New Product</a>
            </div>

            <div th:if="${param.success}">
                <div class="alert alert-success">Saved successfully.</div>
            </div>
            <div th:if="${param.deleted}">
                <div class="alert alert-success">Product deleted successfully.</div>
            </div>
            <div th:if="${param.error}">
                <div class="alert alert-danger">Product not found.</div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle text-nowrap">
                    <thead class="table-light">
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td>
                                <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/product-placeholder.jpg'}"
                                     alt="Product"
                                     style="width: 56px; height: 56px; object-fit: contain; border-radius: 8px; background: #f8f9fa;">
                            </td>
                            <td th:text="${product.name}">Sample Product</td>
                            <td th:text="${product.category != null ? product.category.name : 'Unassigned'}">Category</td>
                            <td th:text="${product.price}">0.00</td>
                            <td th:text="${product.stockQuantity}">0</td>
                            <td>
                                <span th:text="${product.active} ? 'Active' : 'Inactive'">Active</span>
                            </td>
                            <td>
                                <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                                <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this product?');">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${products.empty}">
                            <td colspan="7" class="text-center text-muted">No products found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <div th:replace="footer :: footer"></div>
    <div th:replace="scripts :: scripts"></div>
</body>

</html>
