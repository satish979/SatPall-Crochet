<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="header :: head('Manage Orders')"></head>

<body>
	<div th:replace="header :: navbar"></div>

	<section class="py-5">
		<div class="container">
			<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
				<div>
					<h1 class="section-title mb-1">Manage Orders</h1>
					<p class="text-muted mb-0">Review recent orders in a clear, modern admin layout.</p>
				</div>
				<a th:href="@{/admin/dashboard}" class="btn btn-outline-primary">Back to Dashboard</a>
			</div>

			<div class="card-soft p-4">
				<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
					<div>
						<h4 class="fw-bold mb-1">Recent Orders</h4>
						<p class="text-muted mb-0">Track and manage the most recent customer orders.</p>
					</div>
					<button class="btn btn-primary" type="button">Export</button>
				</div>

				<div class="table-responsive">
					<table class="table align-middle">
						<thead>
							<tr>
								<th>Order ID</th>
								<th>Customer</th>
								<th>Status</th>
								<th>Total</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:if="${#lists.isEmpty(orders)}">
								<td colspan="5" class="text-center text-muted py-4">No orders found yet.</td>
							</tr>
							<tr th:each="order : ${orders}">
								<td th:text="${'#' + order.orderNumber}"></td>
								<td th:text="${order.customer != null ? order.customer.firstName + ' ' + order.customer.lastName : 'Guest'}"></td>
								<td>
									<span class="badge" th:classappend="${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' : (${order.status.name() == 'DELIVERED'} ? 'bg-success' : 'bg-secondary')"
										th:text="${order.status}"></span>
								</td>
								<td th:text="${'₹' + #numbers.formatDecimal(order.total, 1, 2)}"></td>
								<td>
									<button class="btn btn-sm btn-outline-primary me-2" type="button">View</button>
									<button class="btn btn-sm btn-outline-success" type="button">Update</button>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="footer :: footer"></div>
	<div th:replace="scripts :: scripts"></div>
</body>
</html>
