<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="header :: head('Product Form')"></head>


<body>
	<div th:replace="header :: navbar"></div>

	<section class="py-5">
		<div class="container">
			<div class="row">
				<div class="col-lg-10 mx-auto">
					<div class="card shadow-sm border-0">
						<div class="card-body">
							<div class="d-flex justify-content-between align-items-center mb-4">
								<div>
									<h1 th:text="${productForm.id != null ? 'Edit Product' : 'Add Product'}">Product
										Form</h1>
									<p class="text-muted mb-0">Fill in every product detail and upload images.</p>
								</div>
								<a class="btn btn-outline-secondary" th:href="@{/admin/products}">Back to list</a>
							</div>

							<form th:action="@{/admin/products/save}" th:object="${productForm}" method="post"
								enctype="multipart/form-data">
								<input type="hidden" th:field="*{id}" />

								<div class="row g-3">
									<div class="col-md-6">
										<label class="form-label">Product Name</label>
										<input type="text" class="form-control" th:field="*{name}" />
										<div class="invalid-feedback d-block" th:errors="*{name}"></div>
									</div>
									<div class="col-md-6">
										<label class="form-label">Category</label>
										<select class="form-select" th:field="*{categoryId}">
											<option value="" disabled>Select category</option>
											<option th:each="category : ${categories}" th:value="${category.id}"
												th:text="${category.name}"></option>
										</select>
										<div class="invalid-feedback d-block" th:errors="*{categoryId}"></div>
									</div>

									<div class="col-md-4">
										<label class="form-label">Price</label>
										<input type="number" step="0.01" class="form-control" th:field="*{price}" />
										<div class="invalid-feedback d-block" th:errors="*{price}"></div>
									</div>
									<div class="col-md-4">
										<label class="form-label">Stock Quantity</label>
										<input type="number" class="form-control" th:field="*{stockQuantity}" />
										<div class="invalid-feedback d-block" th:errors="*{stockQuantity}"></div>
									</div>
									<div class="col-md-4">
										<label class="form-label">Active</label>
										<select class="form-select" th:field="*{active}">
											<option th:value="true">Active</option>
											<option th:value="false">Inactive</option>
										</select>
									</div>

									<div class="col-12">
										<label class="form-label">Description</label>
										<textarea class="form-control" rows="5" th:field="*{description}"></textarea>
										<div class="invalid-feedback d-block" th:errors="*{description}"></div>
									</div>

									<div class="col-md-4">
										<div class="form-check">
											<input class="form-check-input" type="checkbox" th:field="*{featured}"
												id="featured" />
											<label class="form-check-label" for="featured">Featured</label>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-check">
											<input class="form-check-input" type="checkbox" th:field="*{newArrival}"
												id="newArrival" />
											<label class="form-check-label" for="newArrival">New Arrival</label>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-check">
											<input class="form-check-input" type="checkbox" th:field="*{bestSeller}"
												id="bestSeller" />
											<label class="form-check-label" for="bestSeller">Best Seller</label>
										</div>
									</div>

									<div class="col-12">
										<label class="form-label">Main Product Image</label>
										<input type="file" class="form-control" th:field="*{imageFile}"
										accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
										<div class="form-text">Upload a main product image. Leave blank to keep the
											current image.</div>
									</div>

									<div class="col-12" th:if="${productForm.imageUrl != null}">
										<label class="form-label">Current Main Image</label>
										<div class="d-flex align-items-center gap-3 mb-3">
								<img th:src="${productForm.imageUrl}"
												alt="Main Image" class="img-thumbnail" style="max-width: 180px;" />
											<div class="form-check">
												<input class="form-check-input" type="checkbox"
													th:field="*{removeMainImage}" id="removeMainImage" />
												<label class="form-check-label" for="removeMainImage">Remove this
													image</label>
											</div>
										</div>
									</div>

									<div class="col-12">
										<label class="form-label">Additional Product Images</label>
										<input type="file" class="form-control" th:field="*{additionalFiles}" multiple
									accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
										<div class="form-text">Upload one or more additional images.</div>
									</div>

									<div class="col-12"
										th:if="${productForm.existingAdditionalImages != null and !#lists.isEmpty(productForm.existingAdditionalImages)}">
										<label class="form-label">Existing Additional Images</label>
										<div class="row gy-3">
											<div class="col-md-4"
												th:each="imageUrl,iterStat : ${productForm.existingAdditionalImages}">
												<div class="card">
										<img th:src="${imageUrl}"
														class="card-img-top" alt="Additional Image" />
													<div class="card-body p-3">
														<div class="form-check mb-2">
															<input class="form-check-input" type="checkbox"
																th:field="*{removeAdditionalImages}"
																th:value="${imageUrl}"
																th:id="${'removeImg' + iterStat.index}" />
															<label class="form-check-label"
																th:for="${'removeImg' + iterStat.index}">Delete</label>
														</div>
														<input type="hidden" name="existingAdditionalImages"
															th:value="${imageUrl}" />
													</div>
												</div>
											</div>
										</div>
									</div>

									<div class="col-12 text-end">
										<button type="submit" class="btn btn-primary">Save Product</button>
										<a class="btn btn-outline-secondary" th:href="@{/admin/products}">Cancel</a>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="footer :: footer"></div>

	<div th:replace="scripts :: scripts"></div>
</body>

</html>
