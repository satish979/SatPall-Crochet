<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: head('Product Form')}"></head>

<body>
	<div th:replace="~{header :: navbar}"></div>

	<!-- Breadcrumb Banner -->
	<section class="py-3 bg-warm-surface border-bottom border-light">
		<div class="container">
			<nav aria-label="breadcrumb">
				<ol class="breadcrumb mb-0 small">
					<li class="breadcrumb-item"><a th:href="@{/}" class="text-muted"><i class="fa-solid fa-house me-1"></i>Home</a></li>
					<li class="breadcrumb-item"><a th:href="@{/admin/products}" class="text-muted">Products</a></li>
					<li class="breadcrumb-item active text-dark fw-semibold" aria-current="page" th:text="${productForm.id != null ? 'Edit Product' : 'Add New Product'}">Product Form</li>
				</ol>
			</nav>
		</div>
	</section>

	<section class="py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-10">
					<div class="card-soft p-4 p-md-5">
						<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
							<div>
								<span class="badge-soft mb-2 d-inline-block">Product Editor</span>
								<h2 class="font-heading h3 mb-1" th:text="${productForm.id != null ? 'Edit Handcrafted Item' : 'Add New Handcrafted Item'}">Product Form</h2>
								<p class="text-muted small mb-0">Fill in details, manage stock, assign category and upload photos.</p>
							</div>
							<a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/products}">
								<i class="fa-solid fa-arrow-left me-1"></i> Back to Catalog
							</a>
						</div>

						<form th:action="@{/admin/products/save}" th:object="${productForm}" method="post" enctype="multipart/form-data">
							<input type="hidden" th:field="*{id}" />

							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label small">Product Name *</label>
									<input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Crochet Tulip Bouquet" required />
									<div class="invalid-feedback d-block" th:errors="*{name}"></div>
								</div>
								<div class="col-md-6">
									<label class="form-label small">Category *</label>
									<select class="form-select" th:field="*{categoryId}" required>
										<option value="" disabled>Select category</option>
										<option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
									</select>
									<div class="invalid-feedback d-block" th:errors="*{categoryId}"></div>
								</div>

								<div class="col-md-4">
									<label class="form-label small">Price (₹) *</label>
									<input type="number" step="0.01" class="form-control" th:field="*{price}" placeholder="0.00" required />
									<div class="invalid-feedback d-block" th:errors="*{price}"></div>
								</div>
								<div class="col-md-4">
									<label class="form-label small">Stock Quantity *</label>
									<input type="number" class="form-control" th:field="*{stockQuantity}" placeholder="0" required />
									<div class="invalid-feedback d-block" th:errors="*{stockQuantity}"></div>
								</div>
								<div class="col-md-4">
									<label class="form-label small">Catalog Visibility</label>
									<select class="form-select" th:field="*{active}">
										<option th:value="true">Active (Visible)</option>
										<option th:value="false">Inactive (Hidden)</option>
									</select>
								</div>

								<div class="col-12">
									<label class="form-label small">Product Description</label>
									<textarea class="form-control" rows="4" th:field="*{description}" placeholder="Describe yarn type, dimensions, occasion ideas..."></textarea>
									<div class="invalid-feedback d-block" th:errors="*{description}"></div>
								</div>

								<!-- Badges & Highlights -->
								<div class="col-12">
									<div class="p-3 bg-soft-cream rounded-3 border border-light">
										<label class="form-label small text-uppercase fw-bold text-muted d-block mb-2">Display Badges</label>
										<div class="row g-2">
											<div class="col-md-4">
												<div class="form-check">
													<input class="form-check-input" type="checkbox" th:field="*{featured}" id="featured" />
													<label class="form-check-label small" for="featured">Featured Product</label>
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-check">
													<input class="form-check-input" type="checkbox" th:field="*{newArrival}" id="newArrival" />
													<label class="form-check-label small" for="newArrival">New Arrival</label>
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-check">
													<input class="form-check-input" type="checkbox" th:field="*{bestSeller}" id="bestSeller" />
													<label class="form-check-label small" for="bestSeller">Best Seller</label>
												</div>
											</div>
										</div>
									</div>
								</div>

								<!-- Main Product Image -->
								<div class="col-12">
									<label class="form-label small fw-bold">Primary Product Image</label>
									<input type="file" class="form-control" th:field="*{imageFile}"
										accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
									<small class="text-muted">Upload high resolution image. Leave empty to retain current.</small>
								</div>

								<!-- Existing Main Image Preview -->
								<div class="col-12" th:if="${productForm.imageUrl != null}">
									<label class="form-label small">Current Primary Image</label>
									<div class="d-flex align-items-center gap-3 p-2 bg-light rounded-3 border border-light">
										<img th:src="${productForm.imageUrl}" alt="Main Image"
											style="width: 80px; height: 80px; object-fit: contain; background: #FFFFFF; border-radius: 8px; padding: 4px;" class="border" />
										<div class="form-check">
											<input class="form-check-input" type="checkbox" th:field="*{removeMainImage}" id="removeMainImage" />
											<label class="form-check-label small text-danger" for="removeMainImage">Delete current image</label>
										</div>
									</div>
								</div>

								<!-- Additional Images -->
								<div class="col-12">
									<label class="form-label small fw-bold">Additional Gallery Images</label>
									<input type="file" class="form-control" th:field="*{additionalFiles}" multiple
										accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
									<small class="text-muted">Upload multiple angles or close-up stitch shots.</small>
								</div>

								<!-- Existing Additional Images Preview -->
								<div class="col-12" th:if="${productForm.existingAdditionalImages != null and !#lists.isEmpty(productForm.existingAdditionalImages)}">
									<label class="form-label small">Current Additional Gallery Images</label>
									<div class="row g-3">
										<div class="col-6 col-md-3" th:each="imageUrl,iterStat : ${productForm.existingAdditionalImages}">
											<div class="card-soft p-2 text-center h-100">
												<div class="mb-2" style="height: 90px; background: #FAF6F1; border-radius: 8px; display:flex; align-items:center; justify-content:center; padding: 4px;">
													<img th:src="${imageUrl}" style="max-height: 100%; max-width: 100%; object-fit: contain;" alt="Gallery" />
												</div>
												<div class="form-check d-inline-block">
													<input class="form-check-input" type="checkbox"
														th:field="*{removeAdditionalImages}"
														th:value="${imageUrl}"
														th:id="${'removeImg' + iterStat.index}" />
													<label class="form-check-label small text-danger" th:for="${'removeImg' + iterStat.index}">Remove</label>
												</div>
												<input type="hidden" name="existingAdditionalImages" th:value="${imageUrl}" />
											</div>
										</div>
									</div>
								</div>

								<!-- Actions -->
								<div class="col-12 text-end pt-3 border-top">
									<a class="btn btn-outline-secondary me-2" th:href="@{/admin/products}">Cancel</a>
									<button type="submit" class="btn btn-primary btn-lg">
										<i class="fa-solid fa-floppy-disk me-1"></i> Save Product
									</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="~{footer :: footer}"></div>
	<div th:replace="~{scripts :: scripts}"></div>
</body>

</html>
