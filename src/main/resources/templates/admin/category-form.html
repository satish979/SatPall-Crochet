<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: head('Category Form')}"></head>

<body>
	<div th:replace="~{header :: navbar}"></div>

	<!-- Breadcrumb Banner -->
	<section class="py-3 bg-warm-surface border-bottom border-light">
		<div class="container">
			<nav aria-label="breadcrumb">
				<ol class="breadcrumb mb-0 small">
					<li class="breadcrumb-item"><a th:href="@{/}" class="text-muted"><i class="fa-solid fa-house me-1"></i>Home</a></li>
					<li class="breadcrumb-item"><a th:href="@{/admin/categories}" class="text-muted">Categories</a></li>
					<li class="breadcrumb-item active text-dark fw-semibold" aria-current="page" th:text="${category.id != null ? 'Edit Category' : 'Add Category'}">Category Form</li>
				</ol>
			</nav>
		</div>
	</section>

	<section class="py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="card-soft p-4 p-md-5">
						<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
							<div>
								<span class="badge-soft mb-2 d-inline-block">Category Editor</span>
								<h2 class="font-heading h3 mb-1" th:text="${category.id != null ? 'Edit Category' : 'Add New Category'}">Category Form</h2>
								<p class="text-muted small mb-0">Create or update category titles, display ordering, and cover photo.</p>
							</div>
							<a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm">
								<i class="fa-solid fa-arrow-left me-1"></i> Back
							</a>
						</div>

						<div th:if="${param.success}" class="alert alert-success d-flex align-items-center gap-2 small mb-4">
							<i class="fa-solid fa-circle-check flex-shrink-0"></i>
							<span>Category saved successfully.</span>
						</div>
						<div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 small mb-4">
							<i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
							<span>Please fix the errors and try again.</span>
						</div>

						<form th:action="@{/admin/categories/save}" method="post" enctype="multipart/form-data">
							<input type="hidden" name="id" th:value="${category.id != null ? category.id : ''}" />

							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label small">Category Name *</label>
									<input type="text" class="form-control" name="name" th:value="${category.name}" required maxlength="100" placeholder="e.g. Flowers & Bouquets" />
								</div>
								<div class="col-md-3">
									<label class="form-label small">Display Order</label>
									<input type="number" class="form-control" name="displayOrder" th:value="${category.displayOrder != null ? category.displayOrder : 0}" />
								</div>
								<div class="col-md-3">
									<label class="form-label small">Status</label>
									<select class="form-select" name="active">
										<option th:value="true" th:selected="${category.active == null || category.active}">Active</option>
										<option th:value="false" th:selected="${category.active == false}">Inactive</option>
									</select>
								</div>
								<div class="col-12">
									<label class="form-label small">Description</label>
									<textarea class="form-control" rows="3" name="description" maxlength="500" th:text="${category.description}" placeholder="Brief overview of items in this collection..."></textarea>
								</div>

								<div class="col-12">
									<label class="form-label small fw-bold">Category Cover Image</label>
									<input type="file" class="form-control" name="imageFile" id="categoryImageFile"
										accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
									<small class="text-muted">Upload cover image. Leave blank to keep current photo.</small>
								</div>

								<div class="col-12" th:if="${category.imageUrl != null && !#strings.isEmpty(category.imageUrl)}">
									<label class="form-label small">Current Cover Image</label>
									<div class="d-flex align-items-center gap-3 p-2 bg-light rounded-3 border border-light">
										<img th:src="${category.imageUrl}" alt="Category Image" style="width: 80px; height: 80px; object-fit: contain; background: #FFFFFF; border-radius: 8px; padding: 4px;" class="border" id="currentImagePreview" />
										<div class="form-check">
											<input class="form-check-input" type="checkbox" name="removeImage" id="removeImage" value="true" />
											<label class="form-check-label small text-danger" for="removeImage">Delete current cover image</label>
										</div>
									</div>
								</div>

								<div class="col-12">
									<img id="imagePreview" class="d-none border rounded-3 p-1" style="max-width: 140px; max-height: 140px; object-fit: contain; background: #FAF6F1;" alt="New Preview" />
								</div>

								<div class="col-12 text-end pt-3 border-top">
									<a th:href="@{/admin/categories}" class="btn btn-outline-secondary me-2">Cancel</a>
									<button type="submit" class="btn btn-primary btn-lg">
										<i class="fa-solid fa-floppy-disk me-1"></i> Save Category
									</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="~{footer :: footer}"></div>
	<div th:replace="~{scripts :: scripts}"></div>

	<script>
		(function() {
			const fileInput = document.getElementById('categoryImageFile');
			const preview = document.getElementById('imagePreview');
			const removeCheckbox = document.getElementById('removeImage');

			if (fileInput) {
				fileInput.addEventListener('change', function() {
					if (this.files && this.files[0]) {
						const reader = new FileReader();
						reader.onload = function(e) {
							preview.src = e.target.result;
							preview.classList.remove('d-none');
							if (removeCheckbox) {
								removeCheckbox.checked = false;
							}
						};
						reader.readAsDataURL(this.files[0]);
					}
				});
			}

			if (removeCheckbox) {
				removeCheckbox.addEventListener('change', function() {
					if (this.checked && preview) {
						preview.classList.add('d-none');
						preview.src = '';
						if (fileInput) {
							fileInput.value = '';
						}
					}
				});
			}
		})();
	</script>
</body>

</html>
