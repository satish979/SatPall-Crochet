<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: head('Payment Processing')}"></head>

<body>
	<div th:replace="~{header :: navbar}"></div>

	<section class="py-5 text-center">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-8 col-lg-6">
					<div class="card-soft p-5">
						<div class="spinner-border text-primary mb-4" style="width: 3.5rem; height: 3.5rem; border-width: 0.25em;" role="status">
							<span class="visually-hidden">Loading...</span>
						</div>
						<h2 class="font-heading mb-2">Processing Your Payment</h2>
						<p class="text-muted mb-3">Connecting securely with payment gateway...</p>
						<div class="p-3 bg-soft-cream rounded-3 border border-light mb-0">
							<small class="text-muted d-block"><i class="fa-solid fa-lock text-accent me-1"></i> Please do not close, refresh or navigate away from this page.</small>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="~{footer :: footer}"></div>
	<div th:replace="~{scripts :: scripts}"></div>
</body>

</html>
