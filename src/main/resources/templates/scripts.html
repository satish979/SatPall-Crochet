<div th:fragment="scripts">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/app.js}"></script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const mainImage = document.getElementById('mainProductImage');
			if (!mainImage) return;

			document.querySelectorAll('.thumbnail-wrapper, .thumb-image').forEach(function (thumbEl) {
				thumbEl.addEventListener('click', function () {
					const imgEl = this.tagName === 'IMG' ? this : this.querySelector('img');
					const targetSrc = this.getAttribute('data-image') || (imgEl ? imgEl.getAttribute('data-image') || imgEl.getAttribute('src') : null);
					if (targetSrc) {
						mainImage.style.opacity = '0.4';
						mainImage.src = targetSrc;
						setTimeout(() => {
							mainImage.style.opacity = '1';
						}, 120);

						document.querySelectorAll('.thumbnail-wrapper').forEach(w => w.classList.remove('active'));
						const parentWrapper = this.closest('.thumbnail-wrapper');
						if (parentWrapper) parentWrapper.classList.add('active');
					}
				});
			});
		});
	</script>
</div>

<!-- Cart & Feedback Toast Notifications -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090">
	<div id="cartToast" class="toast luxury-toast align-items-center border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
		<div class="d-flex align-items-center p-2">
			<div class="toast-icon-wrap me-2">
				<i class="fa-solid fa-circle-check text-success"></i>
			</div>
			<div class="toast-body flex-grow-1 p-1">
				<span id="cartToastMsg" class="fw-semibold">Added to cart successfully</span>
			</div>
			<a th:href="@{/cart}" class="btn btn-primary btn-sm my-auto me-2 flex-shrink-0" id="cartToastViewBtn">
				View Cart
			</a>
			<button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
		</div>
	</div>
</div>
