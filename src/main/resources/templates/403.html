<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: head('Access Denied')}"></head>

<body>
	<div th:replace="~{header :: navbar}"></div>

	<section class="py-5 text-center min-vh-75 d-flex align-items-center">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-8 col-lg-6">
					<div class="card-soft p-5">
						<div class="toast-icon-wrap mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: var(--warning-light); color: var(--warning);">
							<i class="fa-solid fa-lock"></i>
						</div>
						<h1 class="font-heading display-4 fw-bold text-dark mb-2">403</h1>
						<h4 class="font-heading mb-2">Artisan Access Restricted</h4>
						<p class="text-muted small mb-4">
							You do not have permission to view or manage this section of the studio.
						</p>
						<div class="d-flex gap-2 justify-content-center">
							<a th:href="@{/}" class="btn btn-primary">Return Home</a>
							<a th:href="@{/customer/login}" class="btn btn-outline-secondary">Sign In</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="~{footer :: footer}"></div>
	<div th:replace="~{scripts :: scripts}"></div>
</body>

</html>
