<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">



<link rel="icon" type="image/x-icon" th:href="@{/uploads/favicon-v2.ico}">
<link rel="icon" type="image/svg+xml" th:href="@{/uploads/favicon-v2.svg}">
<link rel="icon" type="image/png" sizes="32x32" th:href="@{/uploads/favicon-v2-32x32.png}">
<link rel="icon" type="image/png" sizes="16x16" th:href="@{/uploads/favicon-v2-16x16.png}">
<link rel="apple-touch-icon" th:href="@{/uploads/apple-touch-icon-v2.png}">

<head th:replace="~{header :: head('Admin Login')}">

<body class="bg-light">

	<section class="py-4">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-12 col-lg-10 col-xl-9">
					<div class="card border-0 shadow overflow-hidden" style="border-radius: 16px;">
						<div class="row g-0">

							<div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center p-4 p-lg-5"
								style="background: linear-gradient(135deg, #c97b84 0%, #7d5ba6 100%);">
								<div class="text-center text-white px-3">
									<i class="fa-solid fa-spa mb-3" style="font-size: 2.5rem;"></i>
									<h1 class="fw-bold mb-2">Loomelle Crochet</h1>
									<p class="mb-0 opacity-75">
										Manage products, orders, categories, and store content from your admin panel.
									</p>
								</div>
							</div>

							<div class="col-lg-6 p-3 p-md-5 bg-white">
								<div class="mb-3">
									<span class="badge rounded-pill px-2 py-2"
										style="background: rgba(201,123,132,.12); color: #a85d68; font-size: 0.85rem;">
										Admin Access
									</span>
									<h2 class="fw-bold mt-2 mb-1">Welcome back</h2>
									<p class="text-muted mb-0">Sign in to continue to your dashboard.</p>
								</div>

								<div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2">
									<i class="fa-solid fa-circle-exclamation"></i>
									<span>Invalid username or password.</span>
								</div>

								<div th:if="${param.logout}"
									class="alert alert-success d-flex align-items-center gap-2">
									<i class="fa-solid fa-circle-check"></i>
									<span>You have been logged out successfully.</span>
								</div>

								<form th:action="@{/admin/login}" method="post" autocomplete="off">
									<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

									<div class="mb-3">
										<label class="form-label fw-semibold">Username</label>
										<div class="input-group">
											<span class="input-group-text bg-white"><i
													class="fa-regular fa-user"></i></span>
											<input type="text" name="username" class="form-control form-control-lg"
												placeholder="Enter username" required autofocus>
										</div>
									</div>

									<div class="mb-3">
										<label class="form-label fw-semibold">Password</label>
										<div class="input-group">
											<span class="input-group-text bg-white"><i
													class="fa-solid fa-lock"></i></span>
											<input type="password" name="password" class="form-control form-control-lg"
												placeholder="Enter password" required>
										</div>
									</div>

									<div class="d-flex justify-content-between align-items-center mb-3">
										<div class="form-check">
											<input class="form-check-input" type="checkbox" id="rememberMe"
												name="remember-me" value="true">
											<label class="form-check-label small text-muted" for="rememberMe">Remember
												me</label>
										</div>
										<a href="#" class="text-decoration-none small" style="color: #a85d68;">Forgot
											password?</a>
									</div>

									<button type="submit" class="btn btn-primary btn-lg w-100 py-2">
										<i class="fa-solid fa-right-to-bracket me-2"></i> Login
									</button>
								</form>

								<div class="text-center mt-3">
									<a th:href="@{/}" class="text-decoration-none" style="color: #a85d68;">
										<i class="fa-solid fa-arrow-left me-1"></i> Back to website
									</a>
								</div>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="~{scripts :: scripts}">
</body>

</html>
