<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: head('Admin Login')}"></head>

<body class="bg-warm-surface d-flex align-items-center min-vh-100 py-5">
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-12 col-md-10 col-lg-8 col-xl-7">
				<div class="card-soft overflow-hidden shadow-lg border-0">
					<div class="row g-0">
						<!-- Brand Side Banner -->
						<div class="col-md-5 d-none d-md-flex flex-column justify-content-between p-4 p-lg-5 text-white"
							style="background: linear-gradient(135deg, #8E4C55 0%, #C27D86 100%);">
							<div>
								<div class="brand-icon-wrapper mb-3"
									style="background: rgba(255,255,255,0.2); color: #FFFFFF; border: none;">
									<i class="fa-solid fa-spa"></i>
								</div>
								<h3 class="font-heading mb-1 text-white">Loomelle</h3>
								<small class="text-white-50 text-uppercase letter-spacing-1">Handmade Studio</small>
							</div>
							<div class="mt-4">
								<p class="small text-white-75 mb-0" style="line-height: 1.6;">
									Secure artisan management portal for orders, inventory, catalog, and customer care.
								</p>
							</div>
						</div>

						<!-- Login Form Side -->
						<div class="col-md-7 p-4 p-lg-5 bg-white">
							<div class="mb-4">
								<span class="badge-soft mb-2 d-inline-block">Staff Portal</span>
								<h2 class="font-heading h3 mb-1 text-dark">Welcome Back</h2>
								<p class="text-muted small mb-0">Enter your credentials to access the studio panel.</p>
							</div>

							<!-- Alerts -->
							<div th:if="${param.error}"
								class="alert alert-danger d-flex align-items-center gap-2 small mb-3">
								<i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
								<span>Invalid username or password.</span>
							</div>

							<div th:if="${param.logout}"
								class="alert alert-success d-flex align-items-center gap-2 small mb-3">
								<i class="fa-solid fa-circle-check flex-shrink-0"></i>
								<span>You have been signed out successfully.</span>
							</div>

							<form th:action="@{/admin/login}" method="post" autocomplete="off">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

								<div class="mb-3">
									<label class="form-label small">Username</label>
									<div class="input-group">
										<span class="input-group-text bg-light border-end-0"><i
												class="fa-regular fa-user text-muted"></i></span>
										<input type="text" name="username" class="form-control border-start-0"
											placeholder="admin" required autofocus>
									</div>
								</div>

								<div class="mb-3">
									<label class="form-label small">Password</label>
									<div class="input-group">
										<span class="input-group-text bg-light border-end-0"><i
												class="fa-solid fa-lock text-muted"></i></span>
										<input type="password" name="password" class="form-control border-start-0"
											placeholder="••••••••" required>
									</div>
								</div>

								<div class="d-flex justify-content-between align-items-center mb-4">
									<div class="form-check">
										<input class="form-check-input" type="checkbox" id="rememberMe"
											name="remember-me" value="true">
										<label class="form-check-label small text-muted" for="rememberMe">Remember
											me</label>
									</div>
								</div>

								<button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
									<i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In to Dashboard
								</button>
							</form>

							<div class="text-center pt-2">
								<a th:href="@{/}" class="text-muted small text-decoration-none">
									<i class="fa-solid fa-arrow-left me-1"></i> Back to Loomelle Crochet
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="~{scripts :: scripts}"></div>
</body>

</html>
