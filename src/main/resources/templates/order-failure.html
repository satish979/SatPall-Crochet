<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<link rel="icon" type="image/x-icon" th:href="@{/uploads/favicon-v2.ico}">
<link rel="icon" type="image/svg+xml" th:href="@{/uploads/favicon-v2.svg}">
<link rel="icon" type="image/png" sizes="32x32" th:href="@{/uploads/favicon-v2-32x32.png}">
<link rel="icon" type="image/png" sizes="16x16" th:href="@{/uploads/favicon-v2-16x16.png}">
<link rel="apple-touch-icon" th:href="@{/uploads/apple-touch-icon-v2.png}">

<head th:replace="~{header :: head('Payment Failed')}"></head>

<body>
	<div th:replace="~{header :: navbar}"></div>
	<section class="py-5 text-center">
		<div class="container">
			<div class="card-soft p-5">
				<div class="mb-4">
					<i class="fa-solid fa-circle-xmark text-danger fa-4x"></i>
				</div>
				<h1 class="section-title mb-3">Payment Failed</h1>
				<p class="text-muted mb-1" th:if="${reason != null}">Reason: <span th:text="${reason}">Unknown</span></p>
				<p class="text-muted mb-4" th:if="${orderNumber != null}">Order Number: <span th:text="${orderNumber}">ORD-123</span></p>
				<p class="text-muted mb-4" th:unless="${orderNumber != null}">Your payment could not be processed. Please try again.</p>

				<div class="d-flex gap-2 justify-content-center flex-wrap">
					<a th:href="@{/checkout}" class="btn btn-primary">
						<i class="fa-solid fa-rotate-right me-1"></i>Try Again
					</a>
					<a th:href="@{/shop}" class="btn btn-outline-secondary">Continue Shopping</a>
				</div>
			</div>
		</div>
	</section>
	<div th:replace="~{footer :: footer}"></div>
	<div th:replace="~{scripts :: scripts}"></div>
</body>
</html>
