<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: head('Payment Failed')}"></head>

<body>
	<div th:replace="~{header :: navbar}"></div>

	<section class="py-5 text-center">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-8 col-lg-6">
					<div class="card-soft p-4 p-md-5">
						<div class="toast-icon-wrap mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: var(--danger-light); color: var(--danger);">
							<i class="fa-solid fa-circle-exclamation"></i>
						</div>
						<h1 class="font-heading h2 mb-2">Payment Was Not Completed</h1>
						<p class="text-muted mb-2" th:if="${reason != null}">Reason: <span class="fw-semibold text-dark" th:text="${reason}">Unknown</span></p>
						<p class="text-muted mb-3" th:if="${orderNumber != null}">Order Number: <span class="fw-semibold text-dark" th:text="${orderNumber}">ORD-123</span></p>
						<p class="text-muted mb-4" th:unless="${orderNumber != null}">Your payment could not be processed. Don't worry, your cart items are saved.</p>

						<div class="d-flex gap-2 justify-content-center flex-wrap">
							<a th:href="@{/checkout}" class="btn btn-primary">
								<i class="fa-solid fa-rotate-right me-1"></i> Try Again
							</a>
							<a th:href="@{/shop}" class="btn btn-outline-secondary">Continue Shopping</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="~{footer :: footer}"></div>
	<div th:replace="~{scripts :: scripts}"></div>
</body>

</html>
