<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<link rel="icon" type="image/x-icon" th:href="@{/uploads/favicon-v2.ico}">
<link rel="icon" type="image/svg+xml" th:href="@{/uploads/favicon-v2.svg}">
<link rel="icon" type="image/png" sizes="32x32" th:href="@{/uploads/favicon-v2-32x32.png}">
<link rel="icon" type="image/png" sizes="16x16" th:href="@{/uploads/favicon-v2-16x16.png}">
<link rel="apple-touch-icon" th:href="@{/uploads/apple-touch-icon-v2.png}">

<head th:replace="~{header :: head('Order Success')}"></head>

<body>
	<div th:replace="~{header :: navbar}"></div>
	<section class="py-4 text-center">
		<div class="container">
			<div class="card-soft p-3" th:if="${order != null}">
				<div class="mb-3">
					<i class="fa-solid fa-circle-check text-success fa-3x"></i>
				</div>
				<h1 class="section-title mb-2">Order Placed Successfully!</h1>
				<p class="text-muted mb-1">Thank you for shopping with Loomelle Crochet.</p>
				<p class="fw-bold mb-3">Order Number: <span th:text="${order.orderNumber}">ORD-123</span></p>

				<div class="row g-2 text-start mb-3">
					<div class="col-12 col-md-6">
						<div class="card-soft p-3">
							<h6 class="fw-bold mb-2">Shipping Address</h6>
							<p class="mb-0 text-muted small" th:text="${order.shippingAddress}">Address</p>
						</div>
					</div>
					<div class="col-12 col-md-6">
						<div class="card-soft p-3">
							<h6 class="fw-bold mb-2">Payment Status</h6>
							<p class="mb-0" th:text="${order.paymentStatus}">PENDING</p>
						</div>
					</div>
				</div>

				<div class="d-flex gap-2 justify-content-center flex-wrap">
					<a th:href="@{'/invoice/' + ${order.orderNumber}}" class="btn btn-outline-primary btn-sm">
						<i class="fa-solid fa-file-invoice me-1"></i>Download Invoice
					</a>
					<a th:href="@{/my-orders}" class="btn btn-primary btn-sm">
						<i class="fa-solid fa-list me-1"></i>My Orders
					</a>
					<a th:href="@{/shop}" class="btn btn-outline-secondary btn-sm">Continue Shopping</a>
				</div>
			</div>

			<div class="card-soft p-4" th:unless="${order != null}">
				<div class="mb-3">
					<i class="fa-solid fa-circle-check text-success fa-3x"></i>
				</div>
				<h1 class="section-title mb-2">Order Placed Successfully!</h1>
				<p class="text-muted mb-3">Thank you for shopping with Loomelle Crochet.</p>
				<a th:href="@{/shop}" class="btn btn-primary btn-sm">Continue Shopping</a>
			</div>
		</div>
	</section>
	<div th:replace="~{footer :: footer}"></div>
	<div th:replace="~{scripts :: scripts}"></div>
</body>
</html>
