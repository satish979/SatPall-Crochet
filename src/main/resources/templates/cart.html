<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="header :: head('Shopping Cart')"></head>

<body>
	<div th:replace="header :: navbar"></div>

	<section class="py-5">
		<div class="container">
			<h2 class="section-title mb-4">Shopping Cart</h2>
			<div class="row g-4">
				<div class="col-lg-8">
					<div class="card-soft p-4" th:if="${#lists.isEmpty(items)}">
						<div class="text-center py-5">
							<i class="fa-solid fa-cart-shopping fa-3x text-muted mb-3"></i>
							<p class="text-muted">Your cart is empty</p>
							<a th:href="@{/shop}" class="btn btn-primary">Continue
								Shopping</a>
						</div>
					</div>
					<div th:each="item : ${items}" class="card-soft p-4 mb-3" th:unless="${#lists.isEmpty(items)}">
						<div class="d-flex align-items-center justify-content-between">
							<div class="d-flex gap-3 align-items-center">
								<img th:src="${item.imageUrl != null ? item.imageUrl : '/images/product-placeholder.jpg'}"
									width="90" class="rounded-3" alt="">
								<div>
									<h6 class="mb-1" th:text="${item.productName}">Product
										Name</h6>
									<small class="text-muted">Price: ₹<span th:text="${item.price}">0</span></small>
								</div>
							</div>
							<div class="text-end">
								<div class="price mb-2">
									₹<span th:text="${item.subtotal}">0</span>
								</div>
								<div class="d-flex align-items-center gap-2 justify-content-end">
									<span class="text-muted small">Qty: <span th:text="${item.quantity}">1</span></span>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-4" th:unless="${#lists.isEmpty(items)}">
					<div class="card-soft p-4">
						<h5 class="fw-bold mb-3">Order Summary</h5>
						<div class="d-flex justify-content-between mb-2">
							<span>Subtotal</span><span>₹<span th:text="${subtotal}">0</span></span>
						</div>
						<div class="d-flex justify-content-between mb-2">
							<!--	<span>Shipping</span><span>₹99</span>-->
							<span>Shipping</span><span>₹1</span>
						</div>
						<div class="d-flex justify-content-between mb-2">
							<span>Tax (5%)</span><span>₹<span id="cartTax">0</span></span>
						</div>
						<hr>
						<div class="d-flex justify-content-between fw-bold fs-5">
							<span>Total</span><span>₹<span id="cartTotal">0</span></span>
						</div>
						<a th:href="@{/checkout}" class="btn btn-primary w-100 mt-3">Proceed
							to Checkout</a>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="footer :: footer"></div>
	<div th:replace="scripts :: scripts"></div>

	<script th:if="${!#lists.isEmpty(items)}">
		let subtotal = 0;

		document.querySelectorAll(".order-item, .card-soft.p-4.mb-3").forEach(
			function (item) {
				const totalText = item.querySelector(".fw-bold, .price");

				if (totalText) {
					const val = parseFloat(totalText.textContent.replace(
						/,/g, "").replace(/[^0-9.]/g, "")) || 0;

					subtotal += val;
				}
			});

		const shipping = 99;
		const tax = +(subtotal * 0.05).toFixed(2);
		const total = +(subtotal + shipping + tax).toFixed(2);

		document.getElementById("cartTax").textContent = tax.toFixed(2);
		document.getElementById("cartTotal").textContent = total.toFixed(2);
	</script>
</body>

</html>
